<!doctype html>
<html>
<head>
  <meta charset='utf-8'>
  <title>ThreatWatch — Dashboard</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <link rel='stylesheet' href='/static/style.css'>
  <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js' defer></script>
  <script src='/static/dashboard.js' defer></script>
</head>
<body>
<div class='container'>
  <h1>ThreatWatch — Mini SOC</h1>
  <div class='toprow'>
    <div class='counters'>
      <div class='counter'>Total Alerts: <span id='total'>0</span></div>
      <div class='counter'>High: <span id='high'>0</span></div>
      <div class='counter'>Medium: <span id='med'>0</span></div>
      <div class='counter'>Low: <span id='low'>0</span></div>
    </div>
    <div class='chartwrap'><canvas id='chart' width='300' height='200'></canvas></div>
  </div>
  <div class='filters'>
    <label>Filter:
      <select id='filter'>
        <option value='all'>All</option>
        <option value='HIGH'>HIGH</option>
        <option value='MEDIUM'>MEDIUM</option>
        <option value='LOW'>LOW</option>
      </select>
      <button id='refreshBtn' type='button'>Refresh now</button>
    </label>
  </div>
  <div id='alerts'></div>
  <div id='lastUpdate' class='meta last-update'></div>
</div>
</body>
</html>
