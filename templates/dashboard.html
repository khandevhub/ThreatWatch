<!doctype html><html><head><meta charset='utf-8'><title>ThreatWatch — Dashboard</title><meta name='viewport' content='width=device-width, initial-scale=1'><link rel='stylesheet' href='/static/style.css'><script src='https://cdn.jsdelivr.net/npm/chart.js'></script></head><body><div class='container'><h1>ThreatWatch — Mini SOC</h1><div class='toprow'><div class='counters'><div class='counter'>Total Alerts: <span id='total'>0</span></div><div class='counter'>High: <span id='high'>0</span></div><div class='counter'>Medium: <span id='med'>0</span></div><div class='counter'>Low: <span id='low'>0</span></div></div><div class='chartwrap'><canvas id='ruleChart' width='300' height='200'></canvas></div></div><div class='filters'><label>Filter: <select id='filter' onchange='fetchAlerts()'><option value='all'>All</option><option value='HIGH'>HIGH</option><option value='MEDIUM'>MEDIUM</option><option value='LOW'>LOW</option></select></label></div><div id='alerts'></div></div><script>let chart;async function fetchSummary(){let res=await fetch('/api/summary');let data=await res.json();return data;}async function fetchAlerts(){let res=await fetch('/api/alerts');let data=await res.json();const filter=document.getElementById('filter').value;let html='';let total=0,high=0,med=0,low=0;for(let a of data){if(filter!=='all'&&a.severity!==filter) continue;total++;if(a.severity==='HIGH') high++;if(a.severity==='MEDIUM') med++;if(a.severity==='LOW') low++;html+=`<div class='alert ${a.severity.toLowerCase()}'><div class='meta'>${a.time} — <b>${a.rule}</b> — ${a.severity}</div><div class='details'>${a.details}</div></div>`;}document.getElementById('alerts').innerHTML=html||'<p>No alerts yet</p>';document.getElementById('total').innerText=total;document.getElementById('high').innerText=high;document.getElementById('med').innerText=med;document.getElementById('low').innerText=low;const summary=await fetchSummary();const labels=Object.keys(summary);const values=Object.values(summary);if(!chart){const ctx=document.getElementById('ruleChart').getContext('2d');chart=new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[{label:'Alerts',data:values}]},options:{responsive:true}});}else{chart.data.labels=labels;chart.data.datasets[0].data=values;chart.update();}}setInterval(fetchAlerts,1500);fetchAlerts();</script></body></html>
