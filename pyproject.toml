[project]
name = "threatwatch"
version = "0.1.0"
description = "Local ThreatWatch log collector and dashboard demo"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.6",
    "waitress==3.0.2",
    "watchdog==3.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pip-audit==2.10.1",
]

[project.optional-dependencies]
# Optional real semantic embeddings (Phase 4E): ONNX CPU inference, no GPU.
# First use downloads the model once (~130 MB for BAAI/bge-small-en-v1.5).
semantic = [
    "fastembed>=0.3,<2",
]

[tool.uv]
package = false
